<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ward-Beck Systems</title>
  <link rel="stylesheet" href="css/xtm.css?v=20261117e">
</head>
<body>
  <main class="console-viewport">
    <div id="logoContainer" style="display: flex; gap: 10px; padding: 10px; cursor: pointer;" onclick="toggleMode()">
      <div id="wbsLogo" class="logo-box">
        <svg viewBox="0 0 75 22" width="68" height="20">
          <path d="M7.82 6.09 L13.37 16.43 L15.16 16.43 L9.61 6.09 L7.82 6.09 Z ..." fill="#22c55e" />
        </svg>
      </div>
      <div id="mccurdyLogo" class="logo-box">
        <svg viewBox="0 0 200 80" width="68" height="20">
           <path d="M20 10 L180 10 L195 40 L180 70 L20 70 L5 40 Z" fill="#007acc" stroke="#ffffff" stroke-width="4"/>
        </svg>
      </div>
    </div>
    
    <div class="meter-stack">
      <div class="meter-unit" id="visualizerStage"></div>
      <div class="meter-unit pod22-wrap" id="pod22Wrap">
        <div class="meter-unit pod22" id="pod22Stage"></div>
      </div>
    </div>
  </main>

  <script>
    function toggleMode() {
      document.body.classList.toggle("theme-mccurdy");
    }
  </script>
</body>
</html>
